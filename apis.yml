- name: Azure Pipelines Approvals and Checks REST API
  description: >-
    REST API for managing pipeline approvals and checks on resources such as environments, service connections,
    agent pools, variable groups, and secure files. Provides the ability to create and modify check configurations,
    manage approval workflows, query check evaluation details, and control pipeline permissions for protected
    resources.
