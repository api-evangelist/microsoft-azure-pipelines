      https://learn.microsoft.com/en-us/azure/devops/integrate/get-started/authentication/authentication-guidance
- name: Azure Pipelines Release REST API
  description: >-
    REST API for managing release definitions, creating and tracking releases, and configuring deployment
    approvals. Enables programmatic control of the continuous delivery process including defining release
    pipelines with multiple environments, triggering deployments, and managing approval workflows.
  image: https://azure.microsoft.com/svghandler/devops/?width=600&height=315
  humanURL: https://learn.microsoft.com/en-us/rest/api/azure/devops/release/
